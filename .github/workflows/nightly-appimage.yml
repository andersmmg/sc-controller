name: Nightly AppImage

on:
  schedule:
    # 04:00 UTC every day
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nightly-appimage
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build AppImage
        id: build
        uses: ./.github/actions/build-appimage

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SC_Controller-nightly-x86_64.AppImage
          path: ${{ steps.build.outputs.appimage }}
          if-no-files-found: error

      - name: Publish rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly \
            "${{ steps.build.outputs.appimage }}" \
            --target "${GITHUB_REF_NAME}" \
            --title "Nightly build ($(date -u +%Y-%m-%d))" \
            --notes "Automated nightly build of SC Controller from the default branch. The download link for this release never changes."
