name: Nightly AppImage

on:
  schedule:
    # 04:00 UTC every day
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: nightly-appimage
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    outputs:
      changed: ${{ steps.check.outputs.changed }}
    steps:
      - name: Check for new commits since last nightly
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual run, always building."
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last="$(gh api "repos/${GITHUB_REPOSITORY}/commits/nightly" --jq .sha 2>/dev/null || true)"
          if [[ -z "$last" ]]; then
            echo "No nightly built yet, building."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif [[ "$last" == "${GITHUB_SHA}" ]]; then
            echo "No new commits since last nightly, skipping build."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "New commits since last nightly, building."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

  nightly:
    needs: check
    if: needs.check.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build AppImage
        id: build
        uses: ./.github/actions/build-appimage

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: SC_Controller-nightly-x86_64.AppImage
          path: ${{ steps.build.outputs.appimage }}
          if-no-files-found: error

      - name: Publish rolling nightly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --yes --cleanup-tag || true
          gh release create nightly \
            "${{ steps.build.outputs.appimage }}" \
            --target "${GITHUB_SHA}" \
            --title "Nightly build ($(date -u +%Y-%m-%d))" \
            --notes "$(cat <<EOF
          Automated nightly build of SC Controller from the default branch.
          Commit: \`${GITHUB_SHA}\`
          The download link for this release never changes.
          EOF
          )"
