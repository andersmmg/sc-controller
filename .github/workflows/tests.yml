name: Tests

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-pytest \
            python3-pip \
            python3-setuptools \
            python3-gi \
            gir1.2-gtk-3.0 \
            gir1.2-rsvg-2.0 \
            python3-evdev \
            python3-dev \
            zlib1g-dev \
            libusb-1.0-0-dev

      - name: Build C extensions
        run: python3 -m pip wheel --no-build-isolation --no-deps --wheel-dir build/wheel .

      - name: Run tests
        run: python3 -m pytest tests/ -v
