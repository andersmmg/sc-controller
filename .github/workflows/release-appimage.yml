name: Release AppImage

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  version-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches app version
        run: |
          pyver=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          tagver="${GITHUB_REF_NAME#v}"
          echo "Tag: ${GITHUB_REF_NAME}  pyproject.toml version: ${pyver}"
          if [ "$tagver" != "$pyver" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match pyproject.toml version '$pyver'. Update the version in pyproject.toml before tagging."
            exit 1
          fi

  release:
    needs: [test, version-check]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build AppImage
        id: build
        uses: ./.github/actions/build-appimage

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref_name }}-AppImage
          path: ${{ steps.build.outputs.appimage }}
          if-no-files-found: error

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          asset="SC_Controller-${version}-x86_64.AppImage"
          cp "${{ steps.build.outputs.appimage }}" "${asset}"
          sha256sum "${asset}" > "${asset}.sha256"
          gh release create "$GITHUB_REF_NAME" "${asset}" "${asset}.sha256" \
            --title "SC Controller ${version}" \
            --generate-notes
